clear_solid_queue_finished_jobs:
  command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
  schedule: every hour at minute 12

# Sync FishFish domain list weekly
fishfish_sync:
  class: FishFishSyncJob
  queue: maintenance
  schedule: every sunday at 3am

session_cleanup:
  class: SessionCleanupJob
  schedule: every 1 hour

# Unverified account cleanup - remove stale signups
unverified_cleanup:
  class: CleanupUnverifiedAccountsJob
  schedule: every 6 hours

# Heartbeat for monitoring
heartbeat:
  class: HeartbeatJob
  schedule: every 5 minutes

# Batch API metrics for analytics
api_metrics_batch:
  class: ApiMetricsBatchJob
  schedule: every 15 minutes

# Domain availability checks - check if domains are still active
domain_availability_check:
  class: DomainAvailabilityCheckJob
  queue: maintenance
  schedule: every hour at minute 30

# Sync TLD support data from CleanDNS API
cleandns_tld_sync:
  class: CleandnsTldSyncJob
  queue: maintenance
  schedule: every day at 3am

# Sinking Yachts - poll every 10 minutes for near-real-time updates
sinking_yachts_sync:
  class: SinkingYachtsSyncJob
  queue: maintenance
  schedule: every 10 minutes

# Sinking Yachts - full sync weekly (catch any missed updates)
sinking_yachts_full_sync:
  class: SinkingYachtsSyncJob
  queue: maintenance
  args:
    - full_sync: true
  schedule: every sunday at 4am

# OpenPhish - sync every 12 hours (matches feed update frequency)
openphish_sync:
  class: OpenphishSyncJob
  queue: maintenance
  schedule: every 12 hours at minute 15

# Reddit - scrape phishing subreddits every 6 hours
reddit_sync:
  class: RedditSyncJob
  queue: maintenance
  schedule: every 6 hours at minute 45

# PhishDestroy - sync destroylist every 6 hours
phishdestroy_sync:
  class: PhishdestroySyncJob
  queue: maintenance
  schedule: every 6 hours at minute 30

# Blazer checks - run scheduled query checks
blazer_run_checks_5_minutes:
  command: "Blazer.run_checks(schedule: '5 minutes')"
  schedule: every 5 minutes

blazer_run_checks_1_hour:
  command: "Blazer.run_checks(schedule: '1 hour')"
  schedule: every hour

blazer_run_checks_1_day:
  command: "Blazer.run_checks(schedule: '1 day')"
  schedule: every day at 7:30am

blazer_send_failing_checks:
  command: "Blazer.send_failing_checks"
  schedule: every day at 8am