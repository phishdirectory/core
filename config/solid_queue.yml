# frozen_string_literal: true

# Solid Queue Configuration
#
# Queue Priority (highest to lowest):
#   1. critical     - Security incidents, ops alerts (immediate processing)
#   2. webhooks     - External notifications (time-sensitive)
#   3. default      - Normal operations (phish checks, emails, metrics)
#   4. maintenance  - Cleanup jobs (can be delayed)
#   5. low_priority - Retry jobs, background processing (lowest urgency)
#
# Jobs are assigned to queues via `queue_as :queue_name` in the job class.

default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
      concurrency_maintenance_interval: 30

  workers:
    # Single worker processing all queues in priority order
    - queues:
        - critical
        - webhooks
        - default
        - maintenance
        - low_priority
      threads: 3
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default
  workers:
    - queues: "*"
      threads: 1
      polling_interval: 0.1

production:
  dispatchers:
    - polling_interval: 1
      batch_size: 500
      concurrency_maintenance_interval: 30

  workers:
    # Dedicated worker for critical + webhooks (fast response)
    - queues:
        - critical
        - webhooks
      threads: 2
      polling_interval: 0.1
      processes: 1

    # Primary worker for default queue (bulk of the work)
    - queues:
        - default
      threads: 5
      polling_interval: 0.1
      processes: 2

    # Background worker for maintenance and retries
    - queues:
        - maintenance
        - low_priority
      threads: 2
      polling_interval: 1
      processes: 1

  # Recurring jobs (replaces cron)
  recurring:
    # Session cleanup - remove expired sessions
    session_cleanup:
      class: SessionCleanupJob
      schedule: every 1 hour

    # Unverified account cleanup - remove stale signups
    unverified_cleanup:
      class: CleanupUnverifiedAccountsJob
      schedule: every 6 hours

    # Heartbeat for monitoring
    heartbeat:
      class: HeartbeatJob
      schedule: every 5 minutes

    # Batch API metrics for analytics
    api_metrics_batch:
      class: ApiMetricsBatchJob
      schedule: every 15 minutes
