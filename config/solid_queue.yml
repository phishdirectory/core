# frozen_string_literal: true

# Solid Queue Configuration
#
# Queue Priority (highest to lowest):
#   1. critical     - Security incidents, ops alerts (immediate processing)
#   2. webhooks     - External notifications (time-sensitive)
#   3. emails       - User-facing emails (magic links, welcome - users waiting)
#   4. default      - Normal operations (phish checks, reports)
#   5. maintenance  - Cleanup jobs (can be delayed)
#   6. low_priority - Retry jobs, background processing (lowest urgency)
#
# Jobs are assigned to queues via `queue_as :queue_name` in the job class.

default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
      concurrency_maintenance_interval: 30

  workers:
    # Single worker processing all queues in priority order
    - queues:
        - critical
        - webhooks
        - emails
        - default
        - maintenance
        - low_priority
      threads: 3
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default
  workers:
    - queues: "*"
      threads: 1
      polling_interval: 0.1

production:
  dispatchers:
    - polling_interval: 1
      batch_size: 500
      concurrency_maintenance_interval: 30

  workers:
    # Dedicated worker for critical + webhooks + emails (fast response)
    - queues:
        - critical
        - webhooks
        - emails
      threads: 2
      polling_interval: 0.1
      processes: 1

    # Primary worker for default queue (bulk of the work)
    - queues:
        - default
      threads: 5
      polling_interval: 0.1
      processes: 2

    # Background worker for maintenance and retries
    - queues:
        - maintenance
        - low_priority
      threads: 2
      polling_interval: 1
      processes: 1
