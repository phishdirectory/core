openapi: 3.0.3
info:
  title: phish.directory API
  description: |
    Real-time phishing detection API. Check domains and URLs against multiple threat intelligence sources.

    ## Authentication

    Every endpoint except `/health` and `/auth/*` needs an API key. Send it in a header:

    ```
    Authorization: Bearer YOUR_API_KEY
    ```

    Or alternatively:

    ```
    X-API-Key: YOUR_API_KEY
    ```

    There are two kinds of key, and each opens a different part of the API:

    | Kind | Format | Opens |
    |------|--------|-------|
    | User key | `pdat_...` | The check endpoints and `/user/me` |
    | Service key | no prefix | `/webhooks`, `/identity/*` and `/auth/authenticate` |

    A service key can also be flagged as a **trusted source**. Those keys open the
    `/source/*` endpoints, which write your own verdicts into our database instead
    of reading ours. Some endpoints additionally need the calling user to be an
    admin, which is noted on each one.

    ## Rate Limits

    All endpoints require authentication (except `/health`). We use sliding windows with burst support:
    - **Burst:** 60 requests per 10 seconds
    - **Short-term:** 200 requests per minute
    - **Hourly:** 1,000 requests per hour
    - **Bulk:** Max 100 items per request

    ### Upstream Service Limits
    We aggregate data from multiple threat intelligence sources, each with their own limits:
    | Service | Per Minute | Per Day |
    |---------|------------|---------|
    | VirusTotal | 4 | 500 |
    | URLScan | 60 | 1,000 |
    | Google Safe Browsing | 100 | 10,000 |

    When a source is rate-limited, responses include `rate_limited_services` in the details.

  version: '1.0'
  contact:
    name: phish.directory Support
    email: support@phish.directory
  license:
    name: O'Saasy License
    url: https://phish.directory/docs/terms

servers:
  - url: https://phish.directory/api/v1
    description: Production
  - url: http://localhost:3000/api/v1
    description: Development

tags:
  - name: Health
    description: API health checks
  - name: Domain
    description: Domain verification endpoints
  - name: URL
    description: URL verification endpoints
  - name: Phone
    description: Phone number verification endpoints
  - name: Email
    description: Email verification endpoints
  - name: User
    description: User account management
  - name: Auth
    description: Service-to-service authentication
  - name: WHOIS
    description: Domain registration lookups
  - name: Protections
    description: The protected list (admin only)
  - name: Trusted Sources
    description: Verdict ingestion (trusted source service keys only)
  - name: Webhooks
    description: Webhook management (service keys only)
  - name: Identity
    description: User management for federated services (service keys only)
  - name: Admin
    description: Operator endpoints (admin only)

paths:
  /health:
    get:
      operationId: getHealth
      tags:
        - Health
      summary: Health check
      description: Check if the API is operational. No authentication required.
      security: []
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  /auth/authenticate:
    post:
      operationId: postAuthAuthenticate
      tags:
        - Auth
      summary: Verify a service key
      description: |
        Confirm that a service key is valid and usable, and find out which service
        it belongs to. Send the service key itself as the credential. A user key
        (`pdat_*`) is never accepted here.
      responses:
        '200':
          description: The key is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
                    example: true
                  service:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                        example: partner-feed
                  key_id:
                    type: string
                    format: uuid
        '401':
          description: The key is missing, unknown, revoked, or its service is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Invalid API key"

  /auth/token:
    post:
      operationId: postAuthToken
      tags:
        - Auth
      summary: Exchange credentials for an access token
      description: |
        Not implemented. Use `/oauth/token` for OAuth 2.0 token exchange.
      security: []
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'

  /auth/refresh:
    post:
      operationId: postAuthRefresh
      tags:
        - Auth
      summary: Refresh an access token
      description: |
        Not implemented. Use `/oauth/token` with `grant_type=refresh_token`.
      security: []
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'

  /domain/check:
    get:
      operationId: getDomainCheck
      tags:
        - Domain
      summary: Check a domain
      description: Check if a domain is associated with phishing or other malicious activity.
      parameters:
        - name: domain
          in: query
          required: true
          description: The domain to check (e.g., example.com)
          schema:
            type: string
            example: suspicious-site.com
      responses:
        '200':
          description: Domain check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: postDomainCheck
      tags:
        - Domain
      summary: Check a domain
      description: Check if a domain is associated with phishing or other malicious activity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - domain
              properties:
                domain:
                  type: string
                  description: The domain to check
                  example: suspicious-site.com
      responses:
        '200':
          description: Domain check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /domain/bulk:
    get:
      operationId: getDomainBulk
      tags:
        - Domain
      summary: Check multiple domains (query string form)
      description: |
        The same as the POST form, with the values in the query string as
        `?domains[]=...&domains[]=...`. Prefer POST for anything but a
        handful of values: a long query string is easy to truncate.
      parameters:
        - name: domains[]
          in: query
          required: true
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
          example: ["example.com", "suspicious-site.com"]
      responses:
        '200':
          description: Bulk check results, in the order sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/DomainResult'
                  count:
                    type: integer
                    example: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: postDomainBulk
      tags:
        - Domain
      summary: Check multiple domains
      description: Check up to 100 domains in a single request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - domains
              properties:
                domains:
                  type: array
                  items:
                    type: string
                  maxItems: 100
                  example:
                    - example.com
                    - suspicious-site.com
      responses:
        '200':
          description: Bulk domain check results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/DomainResult'
                  count:
                    type: integer
                    example: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /domain/whois:
    get:
      operationId: getDomainWhois
      tags:
        - WHOIS
      summary: Look up domain registration
      description: |
        Registration details for a domain, from WHOIS or RDAP. Results are cached,
        so repeated lookups of the same domain do not hit the registry again.
      parameters:
        - name: domain
          in: query
          required: true
          schema:
            type: string
          example: suspicious-site.com
      responses:
        '200':
          description: Registration information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoisResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No registration information found for this domain
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain:
                    type: string
                  error:
                    type: string
                    example: Domain registration information not found
                  queried_at:
                    type: string
                    format: date-time
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: postDomainWhois
      tags:
        - WHOIS
      summary: Look up domain registration
      description: Same as the GET form, with the domain in the request body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
                  example: suspicious-site.com
      responses:
        '200':
          description: Registration information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoisResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No registration information found for this domain
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /domain/whois/bulk:
    get:
      operationId: getDomainWhoisBulk
      tags:
        - WHOIS
      summary: Look up registration for several domains (query string form)
      description: |
        The same as the POST form, with the domains in the query string as
        `?domains[]=...&domains[]=...`.
      parameters:
        - name: domains[]
          in: query
          required: true
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
          example: ["suspicious-site.com", "example.com"]
      responses:
        '200':
          description: Registration information, in the order sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/WhoisResult'
                  count:
                    type: integer
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        domain:
                          type: string
                        error:
                          type: string
                        retry_after:
                          type: integer
                          nullable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: postDomainWhoisBulk
      tags:
        - WHOIS
      summary: Look up registration for several domains
      description: |
        Up to 100 domains per request. A lookup that fails does not fail the batch:
        it appears in `errors` instead. A rate limit from the registry stops the
        batch early, so `results` can be shorter than what you sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domains]
              properties:
                domains:
                  type: array
                  maxItems: 100
                  items:
                    type: string
                  example: ["suspicious-site.com", "example.com"]
      responses:
        '200':
          description: Registration information, in the order sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/WhoisResult'
                  count:
                    type: integer
                    example: 2
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        domain:
                          type: string
                        error:
                          type: string
                        retry_after:
                          type: integer
                          nullable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /domain/protections:
    get:
      operationId: getDomainProtections
      tags:
        - Protections
      summary: List protected domains
      description: |
        The protected list holds domains that must never be flagged, whatever any
        source reports. Needs an admin user key.
      responses:
        '200':
          description: The protected domains
          content:
            application/json:
              schema:
                type: object
                properties:
                  protections:
                    type: array
                    items:
                      $ref: '#/components/schemas/Protection'
                  count:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: postDomainProtections
      tags:
        - Protections
      summary: Protect a domain
      description: Add a domain to the protected list. Needs an admin user key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [protectable_value]
              properties:
                protectable_value:
                  type: string
                  description: The domain to protect
                  example: example.com
                reason:
                  type: string
                  nullable: true
                  example: Customer owned domain
      responses:
        '201':
          description: The domain is now protected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Protection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /domain/protections/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Public identifier (prt_...) or UUID
        example: prt_4k8xJm2pN9qW
    get:
      operationId: getDomainProtectionsById
      tags:
        - Protections
      summary: Get one protection
      description: Needs an admin user key.
      responses:
        '200':
          description: The protection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Protection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteDomainProtectionsById
      tags:
        - Protections
      summary: Remove a protection
      description: Needs an admin user key.
      responses:
        '204':
          description: The domain is no longer protected
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /url/check:
    get:
      operationId: getUrlCheck
      tags:
        - URL
      summary: Check a URL
      description: Check if a URL is associated with phishing or other malicious activity.
      parameters:
        - name: url
          in: query
          required: true
          description: The full URL to check
          schema:
            type: string
            example: https://suspicious-site.com/login
      responses:
        '200':
          description: URL check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrlResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: postUrlCheck
      tags:
        - URL
      summary: Check a URL
      description: Check if a URL is associated with phishing or other malicious activity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  description: The full URL to check
                  example: https://suspicious-site.com/login
      responses:
        '200':
          description: URL check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrlResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /url/bulk:
    get:
      operationId: getUrlBulk
      tags:
        - URL
      summary: Check multiple URLs (query string form)
      description: |
        The same as the POST form, with the values in the query string as
        `?urls[]=...&urls[]=...`. Prefer POST for anything but a
        handful of values: a long query string is easy to truncate.
      parameters:
        - name: urls[]
          in: query
          required: true
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
          example: ["https://example.com", "https://suspicious-site.com/login"]
      responses:
        '200':
          description: Bulk check results, in the order sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/UrlResult'
                  count:
                    type: integer
                    example: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: postUrlBulk
      tags:
        - URL
      summary: Check multiple URLs
      description: Check up to 100 URLs in a single request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - urls
              properties:
                urls:
                  type: array
                  items:
                    type: string
                  maxItems: 100
                  example:
                    - https://example.com/page
                    - https://suspicious-site.com/login
      responses:
        '200':
          description: Bulk URL check results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/UrlResult'
                  count:
                    type: integer
                    example: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /phone/check:
    get:
      operationId: getPhoneCheck
      tags:
        - Phone
      summary: Check a phone number
      description: Check if a phone number is associated with scam or fraud activity.
      parameters:
        - name: phone
          in: query
          required: true
          description: The phone number to check (E.164 format preferred, e.g., +14155551234)
          schema:
            type: string
            example: "+14155551234"
      responses:
        '200':
          description: Phone number check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: postPhoneCheck
      tags:
        - Phone
      summary: Check a phone number
      description: Check if a phone number is associated with scam or fraud activity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
                  description: The phone number to check (E.164 format preferred)
                  example: "+14155551234"
      responses:
        '200':
          description: Phone number check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /phone/bulk:
    get:
      operationId: getPhoneBulk
      tags:
        - Phone
      summary: Check multiple phone numbers (query string form)
      description: |
        The same as the POST form, with the values in the query string as
        `?phone_numbers[]=...&phone_numbers[]=...`. Prefer POST for anything but a
        handful of values: a long query string is easy to truncate.
      parameters:
        - name: phone_numbers[]
          in: query
          required: true
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
          example: ["+14155551234", "+442071838750"]
      responses:
        '200':
          description: Bulk check results, in the order sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/PhoneResult'
                  count:
                    type: integer
                    example: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: postPhoneBulk
      tags:
        - Phone
      summary: Check multiple phone numbers
      description: Check up to 100 phone numbers in a single request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phones
              properties:
                phones:
                  type: array
                  items:
                    type: string
                  maxItems: 100
                  example:
                    - "+14155551234"
                    - "+442071234567"
      responses:
        '200':
          description: Bulk phone number check results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/PhoneResult'
                  count:
                    type: integer
                    example: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /email/check:
    get:
      operationId: getEmailCheck
      tags:
        - Email
      summary: Check an email address
      description: Check if an email address is associated with fraud, disposable services, or phishing.
      parameters:
        - name: email
          in: query
          required: true
          description: The email address to check
          schema:
            type: string
            format: email
            example: "user@example.com"
      responses:
        '200':
          description: Email check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: postEmailCheck
      tags:
        - Email
      summary: Check an email address
      description: Check if an email address is associated with fraud, disposable services, or phishing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: The email address to check
                  example: "user@example.com"
      responses:
        '200':
          description: Email check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /email/bulk:
    get:
      operationId: getEmailBulk
      tags:
        - Email
      summary: Check multiple email addresses (query string form)
      description: |
        The same as the POST form, with the values in the query string as
        `?emails[]=...&emails[]=...`. Prefer POST for anything but a
        handful of values: a long query string is easy to truncate.
      parameters:
        - name: emails[]
          in: query
          required: true
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
          example: ["user@example.com", "sender@suspicious-site.com"]
      responses:
        '200':
          description: Bulk check results, in the order sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/EmailResult'
                  count:
                    type: integer
                    example: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: postEmailBulk
      tags:
        - Email
      summary: Check multiple email addresses
      description: Check up to 100 email addresses in a single request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - emails
              properties:
                emails:
                  type: array
                  items:
                    type: string
                    format: email
                  maxItems: 100
                  example:
                    - "user1@example.com"
                    - "user2@suspicious.net"
      responses:
        '200':
          description: Bulk email check results
