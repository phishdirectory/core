  /identity/authenticate:
    post:
      operationId: postIdentityAuthenticate
      tags:
        - Identity
      summary: Verify a user's credentials
      description: |
        Needs a service key. Returns one answer for every kind of failure, so a
        caller cannot tell an unknown email from a wrong password or a locked
        account.

        Gated by the `identity_api_enabled` feature flag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: The credentials are valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
                    example: true
                  pd_id:
                    type: string
                    example: PDU5A1B2C3D
                  public_id:
                    type: string
                    example: usr_4k8xJm2pN9qW
                  email:
                    type: string
                    format: email
                  access_level:
                    type: string
                    enum: [user, trusted, admin, superadmin, owner]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: The credentials are not valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
                    example: false
        '503':
          $ref: '#/components/responses/IdentityApiDisabled'

  /identity/users:
    post:
      operationId: postIdentityUsers
      tags:
        - Identity
      summary: Create a user
      description: Needs a service key. Gated by the `identity_api_enabled` feature flag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                first_name:
                  type: string
                last_name:
                  type: string
                password:
                  type: string
                  format: password
                password_confirmation:
                  type: string
                  format: password
                skip_confirmation:
                  type: boolean
                  description: Marks the email as already verified
      responses:
        '201':
          description: The user was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: The email already exists, or validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/IdentityApiDisabled'

