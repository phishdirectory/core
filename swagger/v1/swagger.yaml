  /source/domains:
    post:
      operationId: postSourceDomains
      tags:
        - Trusted Sources
      summary: Upsert domains and their verdicts
      description: |
        Push your own verdicts in. The submission upserts: it creates the record
        when we have never seen the value, and replaces the verdict on the record
        when we have. Our upstream checks do not run.

        Needs a service key flagged as a trusted source. A user key is refused.

        One bad entry does not fail the request. Every entry gets its own result,
        and the response is 200 as long as the request itself was well formed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domains]
              properties:
                domains:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  description: |
                    Bare values, or objects. A bare value takes the request-level
                    classification and confidence.
                  items:
                    oneOf:
                      - type: string
                        example: evil.example
                      - $ref: '#/components/schemas/SourceEntry'
                classification:
                  type: string
                  enum: [phishing, suspicious, clean]
                  description: Applied to every entry that states none of its own
                  example: phishing
                confidence:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 1
                  description: Applied to every entry that states none of its own. Defaults to 1.0.
                  example: 0.99
      responses:
        '200':
          description: The submission was processed. Check each entry's status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceUpsertResponse'
        '400':
          description: The array is missing, empty, or holds more than 1000 entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Maximum 1000 entries per request
                  received:
                    type: integer
                    example: 1500
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The key is not flagged as a trusted source
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Trusted source access required
                  hint:
                    type: string
                    example: This endpoint needs a service key marked as a trusted source

