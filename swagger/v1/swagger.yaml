  /admin/domain/bulk_import:
    post:
      operationId: postAdminDomainBulkImport
      tags:
        - Admin
      summary: Queue domains for checking
      description: |
        Seeds domain records and queues a check for each one that needs it. Unlike
        the trusted source endpoints, this states no verdict: our own checks decide.
        Needs an admin user key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domains]
              properties:
                domains:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items:
                    type: string
      responses:
        '202':
          description: The domains were queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: integer
                    example: 250
                  job_id:
                    type: string
                  message:
                    type: string
                    example: Domains queued for processing
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Any API key. A user key carries the pdat_ prefix; a service key has no
        prefix. Which endpoints the key opens depends on its kind.
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Any API key. A user key carries the pdat_ prefix; a service key has no
        prefix. Which endpoints the key opens depends on its kind.

  schemas:
    DomainResult:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the domain record
          example: dom_4k8xJm2pN9qW
        domain:
          type: string
          description: The normalized domain
          example: suspicious-site.com
        verdict:
          type: string
          enum: [clean, suspicious, phishing, unknown, protected]
          description: The verdict for this domain
          example: phishing
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          nullable: true
          description: Confidence score (0-1)
          example: 0.94
        scam_category:
          type: string
          nullable: true
          description: Scam taxonomy category, once the record has been classified
          example: credential_theft
        scam_subcategory:
          type: string
          nullable: true
          description: Scam taxonomy subcategory
          example: fake_login_page
        verdict_id:
          type: string
          nullable: true
          description: Public identifier of the verdict record
          example: vrd_7fQ2xR4tL1mZ
        last_checked:
          type: string
          format: date-time
          nullable: true
          description: When the domain was last checked
        created_at:
          type: string
          format: date-time
          description: When the domain was first seen

    UrlResult:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the URL record
          example: url_4k8xJm2pN9qW
        url:
          type: string
          description: The normalized URL
          example: https://suspicious-site.com/login
        domain:
          type: string
          nullable: true
          description: The host portion of the URL
          example: suspicious-site.com
        verdict:
          type: string
          enum: [clean, suspicious, phishing, unknown, protected]
          description: The verdict for this URL
          example: phishing
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          nullable: true
          description: Confidence score (0-1)
          example: 0.87
        scam_category:
          type: string
          nullable: true
          description: Scam taxonomy category, once the record has been classified
          example: credential_theft
        scam_subcategory:
          type: string
          nullable: true
          description: Scam taxonomy subcategory
          example: fake_login_page
        verdict_id:
          type: string
          nullable: true
          description: Public identifier of the verdict record
          example: vrd_7fQ2xR4tL1mZ
        last_checked:
          type: string
          format: date-time
          nullable: true
          description: When the URL was last checked
        created_at:
          type: string
          format: date-time
          description: When the URL was first seen

    PhoneResult:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the phone record
          example: phn_4k8xJm2pN9qW
        phone_number:
          type: string
          description: The phone number in E.164 format
          example: "+14155551234"
        verdict:
          type: string
          enum: [clean, suspicious, phishing, unknown, protected]
          description: The verdict for this phone number
          example: clean
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          nullable: true
          description: Confidence score (0-1)
          example: 0.85
        phone_type:
          type: string
          enum: [mobile, voip, landline, toll_free, unknown]
          nullable: true
          description: Type of phone number
          example: mobile
        country_code:
          type: string
          nullable: true
          description: ISO 3166-1 alpha-2 country code
          example: US
        carrier:
          type: string
          nullable: true
          description: Phone carrier name
          example: Verizon
        scam_category:
          type: string
          nullable: true
          description: Scam taxonomy category, once the record has been classified
          example: credential_theft
        scam_subcategory:
          type: string
          nullable: true
          description: Scam taxonomy subcategory
          example: fake_login_page
        verdict_id:
          type: string
          nullable: true
          description: Public identifier of the verdict record
          example: vrd_7fQ2xR4tL1mZ
        last_checked:
          type: string
          format: date-time
          nullable: true
          description: When the phone number was last checked
        created_at:
          type: string
          format: date-time
          description: When the phone number was first seen

    EmailResult:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the email record
          example: eml_4k8xJm2pN9qW
        email:
          type: string
          format: email
          description: The email address
          example: user@example.com
        domain:
          type: string
          description: The domain portion of the email
          example: example.com
        verdict:
          type: string
          enum: [clean, suspicious, phishing, unknown, protected]
          description: The verdict for this email
          example: clean
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          nullable: true
          description: Confidence score (0-1)
          example: 0.92
        disposable:
          type: boolean
          nullable: true
          description: Whether the email uses a disposable/temporary domain
          example: false
        free_provider:
          type: boolean
          nullable: true
          description: Whether the email uses a free email provider
          example: true
        deliverable:
          type: boolean
          nullable: true
          description: Whether the email appears to be deliverable
          example: true
        valid_mx:
          type: boolean
          nullable: true
          description: Whether the domain has valid MX records
          example: true
        reputation_score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          nullable: true
          description: Email reputation score (0-1)
          example: 0.85
        scam_category:
          type: string
          nullable: true
          description: Scam taxonomy category, once the record has been classified
          example: credential_theft
        scam_subcategory:
          type: string
          nullable: true
          description: Scam taxonomy subcategory
          example: fake_login_page
        verdict_id:
          type: string
          nullable: true
          description: Public identifier of the verdict record
          example: vrd_7fQ2xR4tL1mZ
        last_checked:
          type: string
          format: date-time
          nullable: true
          description: When the email was last checked
        created_at:
          type: string
          format: date-time
          description: When the email was first seen

    User:
      type: object
      properties:
        pd_id:
          type: string
          description: Unique user identifier
          example: PDU5A1B2C3D
        email:
          type: string
          format: email
          example: user@example.com
        first_name:
          type: string
          example: John
        last_name:
          type: string
          example: Doe
        username:
          type: string
          example: jdoe
        access_level:
          type: string
          enum: [user, trusted, admin, superadmin, owner]
          example: user
        created_at:
          type: string
          format: date-time

    WhoisResult:
      type: object
      properties:
        domain:
          type: string
          example: suspicious-site.com
        registrar:
          type: string
          nullable: true
          example: NameCheap, Inc.
        registrar_url:
          type: string
          nullable: true
        registered_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: When the registry record was last updated
        expires_at:
          type: string
          format: date-time
          nullable: true
        domain_age_days:
          type: integer
          nullable: true
          description: Days since registration. A very new domain is a common phishing signal.
          example: 3
        days_until_expiry:
          type: integer
          nullable: true
        nameservers:
          type: array
          nullable: true
          items:
            type: string
        status:
          type: array
          nullable: true
          description: EPP status codes from the registry
          items:
            type: string
        dnssec:
          type: boolean
          nullable: true
        source:
          type: string
          nullable: true
          description: Which lookup answered, RDAP or WHOIS
          example: rdap
        queried_at:
          type: string
          format: date-time

    Protection:
      type: object
      properties:
        id:
          type: string
          example: prt_4k8xJm2pN9qW
        domain:
          type: string
          example: example.com
        reason:
          type: string
          nullable: true
          example: Customer owned domain
        protected_by:
          type: string
          description: Public identifier of the user who added the protection
          example: usr_4k8xJm2pN9qW
        created_at:
          type: string
          format: date-time

    Webhook:
      type: object
      properties:
        id:
          type: string
          example: swh_4k8xJm2pN9qW
        url:
          type: string
          format: uri
          example: https://example.com/hooks/phish
        events:
          type: array
          items:
            type: string
            enum: [user.created, user.role_changed, domain.verdict, url.verdict]
        active:
          type: boolean
          description: False once the webhook has been removed
          example: true
        created_at:
          type: string
          format: date-time

    SourceEntry:
      type: object
      description: |
        One value a trusted source is classifying. The value goes under the key
        that matches the endpoint (domain, url, email or phone_number), or under
        the generic key `value`.
      properties:
        domain:
          type: string
          example: evil.example
        url:
          type: string
          example: https://evil.example/login
        email:
          type: string
          format: email
          example: sender@evil.example
        phone_number:
          type: string
          description: E.164 format
          example: "+14155551234"
        value:
          type: string
          description: Generic alternative to the type-specific key above
        classification:
          type: string
          enum: [phishing, suspicious, clean]
          description: |
            Overrides the request-level classification. `unknown` and `protected`
            are refused: the first carries no information, and the second is an
            operator decision rather than a source's.
          example: phishing
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Defaults to 1.0
          example: 0.99
        metadata:
          type: object
          additionalProperties: true
          description: Free-form context stored on the verdict. At most 4KB of JSON.
          example:
            feed: daily
            first_seen: "2026-09-01"

    SourceResult:
      type: object
      description: What happened to one submitted entry.
      properties:
        value:
          type: string
          description: The normalized value
          example: evil.example
        status:
          type: string
          enum: [created, updated, invalid, rejected]
          description: |
            `created` means the value was new to us. `updated` means we already
            held it and its verdict now says what you sent. `invalid` means the
            value, classification, confidence or metadata was malformed.
            `rejected` means the value is on our protected list, so nothing was
            written.
          example: created
        id:
          type: string
          nullable: true
          description: Public identifier of the record. Absent on invalid and rejected entries.
          example: dom_4k8xJm2pN9qW
        classification:
          type: string
          nullable: true
          enum: [phishing, suspicious, clean]
          example: phishing
        confidence:
          type: number
          format: float
          nullable: true
          example: 0.99
        verdict_id:
          type: string
          nullable: true
          example: vrd_7fQ2xR4tL1mZ
        reason:
          type: string
          nullable: true
          description: Why the entry was refused. Present on invalid and rejected entries.
          example: "Invalid domain format"
        protection_id:
          type: string
          nullable: true
          description: The protection that refused this entry. Present on rejected entries.
          example: prt_4k8xJm2pN9qW

    SourceUpsertResponse:
      type: object
      properties:
        results:
          type: array
          description: One result per submitted entry, in the order sent
          items:
            $ref: '#/components/schemas/SourceResult'
        counts:
          type: object
          description: Entries per status. A status with no entries is left out.
          additionalProperties:
            type: integer
          example:
            created: 1
            updated: 1
        count:
          type: integer
          description: Total entries processed
          example: 2

    IdentityUser:
      type: object
      properties:
        pd_id:
          type: string
          example: PDU5A1B2C3D
        public_id:
          type: string
          example: usr_4k8xJm2pN9qW
        email:
          type: string
          format: email
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        full_name:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, suspended, deactivated]
        access_level:
          type: string
          enum: [user, trusted, admin, superadmin, owner]
        staff:
          type: boolean
        pd_dev:
          type: boolean
        email_verified:
          type: boolean
        has_password:
          type: boolean
        locked_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: Missing required parameter

  responses:
    BadRequest:
      description: Bad request - missing or invalid parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Missing required parameter: domain"

    Unauthorized:
      description: Unauthorized - invalid or missing API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Invalid or missing API key"

    Forbidden:
      description: Authenticated, but this key or user may not use this endpoint
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Admin access required"

    NotFound:
      description: The resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Resource not found"

    TooManyRequests:
      description: |
        Rate limit exceeded. The `Retry-After` header says how long to wait.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Rate limit exceeded
              retry_after:
                type: integer
                nullable: true

    ServiceUnavailable:
      description: An upstream lookup failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    IdentityApiDisabled:
      description: The identity_api_enabled feature flag is off
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Identity API is not enabled"

    NotImplemented:
      description: This endpoint is not implemented
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Use /oauth/token for OAuth 2.0 token exchange"

    UnprocessableEntity:
      description: Unprocessable entity - validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string

security:
  - BearerAuth: []
  - ApiKeyHeader: []
