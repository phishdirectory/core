          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: postWebhooks
      tags:
        - Webhooks
      summary: Register a webhook
      description: |
        Needs a service key. The signing secret is returned once, on creation, and
        never again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  example: https://example.com/hooks/phish
                events:
                  type: array
                  description: Defaults to every event when omitted
                  items:
                    type: string
                    enum: [user.created, user.role_changed, domain.verdict, url.verdict]
      responses:
        '201':
          description: The webhook was registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhook:
                    $ref: '#/components/schemas/Webhook'
                  secret:
                    type: string
                    description: Signing secret. Shown only here, so store it now.
